name: Publish Go SDK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      c_sdk_version:
        description: 'C SDK GitHub release tag'
        required: true
        default: 'c-sdk-v0.9.0'
      go_version:
        description: 'Go module version to publish'
        required: true
        default: 'v0.9.0'

concurrency:
  group: go-sdk-release-${{ github.event.inputs.go_version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'

      - name: Fetch static native libraries
        run: ./sdks/go/scripts/fetch-static-libs.sh "${{ github.event.inputs.c_sdk_version }}"

      - name: Verify linux-amd64 build
        working-directory: sdks/go/sdk
        env:
          CGO_ENABLED: '1'
        run: go build -v .

      - name: Pin module versions
        run: ./sdks/go/scripts/bump-module-versions.sh "${{ github.event.inputs.go_version }}"

      - name: Update bindings native version metadata
        shell: bash
        run: |
          C_SDK_VERSION="${{ github.event.inputs.c_sdk_version }}"
          NATIVE_VERSION="${C_SDK_VERSION#c-sdk-v}"
          cat > sdks/go/bindings/version.go <<EOF
          package mosscore

          // NativeLibVersion is the Moss C SDK version bundled with published Go bindings.
          const NativeLibVersion = "${NATIVE_VERSION}"

          // NativeLibReleaseTag is the GitHub release tag used to fetch native artifacts.
          const NativeLibReleaseTag = "${C_SDK_VERSION}"
          EOF

      - name: Publish module tags
        run: ./sdks/go/scripts/publish-module-tags.sh "${{ github.event.inputs.go_version }}"
